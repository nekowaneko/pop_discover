#每 6 小時：爬新作品 → 資料庫存到 data 分支 → 建索引 → 部署 GitHub Pages
name: discover

on:
  schedule:
    - cron: '0 */6 * * *'  #每 6 小時執行一次（UTC）
  workflow_dispatch:  #可以在 Actions 頁面手動執行

permissions:
  contents: write  #推送 data 分支
  pages: write  #部署 GitHub Pages
  id-token: write

concurrency:
  group: discover  #同時只跑一個，避免兩次執行搶著寫資料庫
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: 取出程式碼
        uses: actions/checkout@v6

      - name: 安裝 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: 安裝套件
        run: pip install requests

      #資料庫存在只保留最新一版的 data 分支（不 commit 進 main，避免 repo 越來越肥）
      #data 分支存在卻取不下來時直接失敗，絕不改用舊資料，否則後面會覆蓋掉 data 分支的新資料
      #只有 data 分支確定不存在（全新 repo）時，才用 legacy/ 裡 2024 年的舊資料庫當起點
      - name: 取得最新資料庫
        id: getdb
        run: |
          set +e
          git ls-remote --exit-code --heads origin data >/dev/null
          status=$?  #0：分支存在；2：分支不存在；其他：網路或權限錯誤
          set -e
          if [ "$status" = "0" ]; then
            git fetch --depth=1 origin data
            git show origin/data:web_info.db.gz | gunzip > web_info.db
            test -s web_info.db
            echo "已從 data 分支取得資料庫"
          elif [ "$status" = "2" ]; then
            cp legacy/web_info.db web_info.db
            echo "data 分支不存在，使用 legacy/web_info.db 當起點"
          else
            echo "無法確認 data 分支（狀態碼 $status），本次停止，不覆蓋任何資料"
            exit 1
          fi

      - name: 爬取新作品
        id: crawl
        run: |
          set -o pipefail
          python crawl.py 2>&1 | tee crawl.log
        env:
          PYTHONUNBUFFERED: '1'
          PIXIV_PHPSESSID: ${{ secrets.PIXIV_PHPSESSID }}  #選用，沒設定就只抓得到全年齡作品
          SAVE_TARGET: ${{ github.ref == 'refs/heads/main' && '200' || '50' }}  #分支測試只存 50 筆

      #爬蟲中途失敗時，已存進去的資料仍然有效，所以照樣保存；同時附上執行紀錄方便查問題
      - name: 資料庫與執行紀錄存到 data 分支
        if: ${{ !cancelled() && steps.getdb.outcome == 'success' }}  #沒取得資料庫就不推，避免覆蓋
        run: |
          mkdir -p /tmp/data
          gzip -9 -c web_info.db > /tmp/data/web_info.db.gz
          cp crawl.log /tmp/data/crawl.log 2>/dev/null || echo "沒有執行紀錄" > /tmp/data/crawl.log
          echo "執行結果：${{ steps.crawl.outcome }}（${{ github.ref_name }} ${{ github.sha }}）" >> /tmp/data/crawl.log
          cd /tmp/data
          git init -q -b data
          git add web_info.db.gz crawl.log
          git -c user.name="nekowaneko" -c user.email="ccheng686@yahoo.com.tw" commit -q -m "資料庫更新 $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data

      #爬蟲失敗時仍用既有資料重建網站，網站不會因此壞掉；這次執行仍會標成失敗，方便發現問題
      - name: 建立網站資料索引
        if: ${{ !cancelled() && steps.getdb.outcome == 'success' }}
        run: |
          python build_index.py
          cp -r design site/design

      - name: 上傳網站
        if: ${{ !cancelled() && steps.getdb.outcome == 'success' }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: crawl
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}  #只有 main 才部署網站
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5
